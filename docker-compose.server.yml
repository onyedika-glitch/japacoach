# For a VPS where nginx already owns ports 80/443 (other sites on the same server).
# The Japa Coach web container listens on localhost only; the host nginx proxies japacoach.com to it
# and certbot handles HTTPS. Enable with COMPOSE_FILE=docker-compose.yml:docker-compose.server.yml in .env.
services:
  web:
    environment:
      DOMAIN: ":80"
    ports: !override
      - "127.0.0.1:${WEB_PORT:-10010}:80"
